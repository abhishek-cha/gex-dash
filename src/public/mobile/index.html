<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>GEX Dash</title>
  <link rel="manifest" href="/mobile/manifest.json" />
  <link rel="stylesheet" href="/mobile/mobile.css" />
</head>
<body>

<div id="login-screen">
  <h1>GEX Dash</h1>
  <p>Connect your Schwab Developer account to view Gamma Exposure levels</p>
  <a href="/auth/login">Connect with Schwab</a>
</div>

<div id="app">
  <!-- Watchlist Tab -->
  <div id="tab-watchlist" class="tab-view active">
    <div class="tab-header">
      <span class="tab-title">Watchlist</span>
      <select id="wl-add-btn">
        <option value="" disabled selected>+</option>
        <option value="symbol">Add Symbol</option>
        <option value="section">New Section</option>
      </select>
    </div>
    <div id="wl-sections"></div>
  </div>

  <!-- Chart Tab -->
  <div id="tab-chart" class="tab-view">
    <div id="chart-header">
      <div class="chart-name-line" id="chart-name">--</div>
      <div class="chart-data-line">
        <span id="chart-price">--</span>
        <span id="chart-change">--</span>
        <span id="chart-total-gex" class="total-gex">GEX <span id="chart-total-gex-val">--</span></span>
      </div>
    </div>
    <div id="chart-area">
      <div id="chart-price-wrap"></div>
      <div id="chart-gex-wrap"></div>
    </div>
    <div id="chart-toolbar">
      <select id="picker-symbol"></select>
      <select id="picker-freq">
        <option value="5m">5m</option>
        <option value="15m">15m</option>
        <option value="30m">30m</option>
        <option value="1D" selected>1D</option>
        <option value="1W">1W</option>
        <option value="1M">1M</option>
      </select>
      <select id="picker-range">
        <option value="5D">5D</option>
        <option value="1M">1M</option>
        <option value="3M" selected>3M</option>
        <option value="6M">6M</option>
        <option value="1Y">1Y</option>
        <option value="2Y">2Y</option>
        <option value="5Y">5Y</option>
      </select>
      <select id="picker-view">
        <option value="chart">Chart Only</option>
        <option value="gex">Chart + GEX</option>
        <option value="oi">Chart + OI</option>
        <option value="vol">Chart + Volume</option>
      </select>
      <div id="exp-group" class="hidden">
        <select id="picker-exp" multiple></select>
        <button id="exp-all">All</button>
        <button id="exp-clear">Clear</button>
      </div>
    </div>
  </div>


  <!-- Tab Bar -->
  <div id="tab-bar">
    <button class="tab-btn active" data-tab="watchlist">
      <span class="tab-icon">☰</span>
      <span class="tab-label">Watchlist</span>
    </button>
    <button class="tab-btn" data-tab="chart">
      <span class="tab-icon">◧</span>
      <span class="tab-label">Chart</span>
    </button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js"
  }
}
</script>

<script type="module" src="/mobile/mobile.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/mobile/sw.js');
  }
</script>

</body>
</html>
